
# kitty.conf generated by Confitty on 2026-07-08
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family JetBrains Mono
font_size 12
disable_ligatures cursor

# --- Cursor ---
cursor #e01b24
cursor_shape beam
cursor_blink_interval 0.5

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
mouse_hide_wait 1
underline_hyperlinks always
copy_on_select clipboard

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.2

# --- Window Layout ---
window_border_width 1pt
window_padding_width 11
active_border_color #bb9af7
inactive_text_alpha 0.7
hide_window_decorations yes
confirm_os_window_close 1

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #1a1b26
active_tab_background #bb9af7
inactive_tab_foreground #565f89
inactive_tab_background #24283b

# --- Colors ---
foreground #c0caf5
background #1a1b26
selection_foreground #1a1b26
selection_background #283457
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
cursor #f7768e
cursor_text_color #1a1b26
url_color #7aa2f7

# --- Advanced ---
allow_remote_control socket-only

